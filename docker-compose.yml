services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "ServiceMarketplaceDb"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-Marketplace2026!}"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ServiceMarketplaceDb"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./ServiceMarketplace.API
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=ServiceMarketplaceDb;Username=postgres;Password=${POSTGRES_PASSWORD:-Marketplace2026!};"
      # Uses the local redis service below. Point at a managed instance by setting REDIS_CONNECTION.
      ConnectionStrings__Redis: "${REDIS_CONNECTION:-redis:6379,abortConnect=False}"
      Jwt__Key: "${JWT_KEY:?JWT_KEY must be set to a secret of at least 32 characters}"
      Jwt__Issuer: "ServiceMarketplace"
      Jwt__Audience: "ServiceMarketplaceClient"
      HuggingFace__ApiKey: "${HUGGINGFACE_API_KEY}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./ServiceMarketplace.Client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
